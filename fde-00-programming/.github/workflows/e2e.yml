name: e2e

# Starts the real stack and calls it: once as a local process (SQLite), once through
# the same Compose file used on Docker, Podman and Rancher Desktop (Postgres), and
# once on a kind cluster with the desktop Kubernetes manifests (in-cluster Postgres).
# Reference repos load 500 seeded synthetic complaints first; starter repos cannot
# until the cleaning exercises are done, so they smoke-test an empty database.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: make e2e

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx pyyaml
      - run: docker compose -f deploy/compose/compose.yaml up -d --build --wait
      - name: Load synthetic complaints (reference repos)
        if: hashFiles('.starter') == ''
        run: >-
          docker compose -f deploy/compose/compose.yaml --profile jobs run --rm ingest
          complaints-ingest ingest-synthetic --count 500
      - run: python scripts/smoke_test.py --base-url http://127.0.0.1:8000
      - if: failure()
        run: docker compose -f deploy/compose/compose.yaml logs
      - if: always()
        run: docker compose -f deploy/compose/compose.yaml down -v

  kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx pyyaml
      - uses: helm/kind-action@v1
        with:
          cluster_name: fde
      - name: Build and load image
        run: |
          docker build -t localhost/fde-00-programming:local .
          kind load docker-image localhost/fde-00-programming:local --name fde
      - name: Deploy the kind overlay
        run: |
          kubectl apply -k deploy/kubernetes/overlays/kind
          kubectl -n fde rollout status statefulset/fde-00-programming-postgres --timeout=180s
          kubectl -n fde rollout status deploy/fde-00-programming --timeout=180s
      - name: Load synthetic complaints (reference repos)
        if: hashFiles('.starter') == ''
        run: >-
          kubectl -n fde exec deploy/fde-00-programming --
          complaints-ingest ingest-synthetic --count 500
      - name: Smoke test through a port-forward
        run: |
          kubectl -n fde port-forward svc/fde-00-programming 8000:80 &
          sleep 3
          python scripts/smoke_test.py --base-url http://127.0.0.1:8000
      - if: failure()
        run: |
          kubectl -n fde get pods,pvc,jobs
          kubectl -n fde describe pods
          kubectl -n fde logs deploy/fde-00-programming --tail=100
          kubectl -n fde logs statefulset/fde-00-programming-postgres --tail=50
