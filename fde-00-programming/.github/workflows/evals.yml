name: evals

# Phase 0 has no model: its "evals" are the throughput benchmark and the Postgres
# integration tests. Runs weekly and on demand, uploads the JSON reports as artifacts.
# GitHub-hosted runners vary, so compare runs only with each other, and commit
# numbers to the README only from a machine you describe.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: complaints
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Benchmark on SQLite and Postgres (reference repos only)
        if: hashFiles('.starter') == ''
        run: |
          python scripts/benchmark.py --count 50000 --repeats 3 --out ci-results
          python scripts/benchmark.py --count 50000 --repeats 3 --out ci-results \
            --database-url postgresql+psycopg://postgres:postgres@127.0.0.1:5432/complaints
      - uses: actions/upload-artifact@v4
        if: hashFiles('.starter') == ''
        with:
          name: benchmark-results
          path: ci-results/
