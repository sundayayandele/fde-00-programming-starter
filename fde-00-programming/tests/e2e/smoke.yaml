# End-to-end smoke checks run by scripts/smoke_test.py against a live service
# (local process, Docker/Podman/Rancher Desktop, Kubernetes or cloud).
# `make e2e` loads 500 seeded synthetic complaints first; on an empty database the
# data checks still pass because they only assert the response shape.
checks:
  - name: liveness
    path: /health/live
    expect_keys: [status]
  - name: readiness (database reachable)
    path: /health/ready
    expect_keys: [status, version, database]
  - name: metrics exposed
    path: /metrics/
    expect_contains: http_requests_total
  - name: complaints by month
    path: /api/v1/by-month
  - name: complaint search
    path: /api/v1/complaints
    params: {limit: 5}
    expect_keys: [count, limit, offset, items]
  - name: search input validation
    path: /api/v1/complaints
    params: {limit: 0}
    expect_status: 422
  - name: ingest run log
    path: /api/v1/runs
  - name: summary report
    exercise: true          # depends on the week-04 GROUP BY exercise; skipped in starters
    path: /api/v1/summary
    expect_keys: [total_complaints, by_product, top_issues, timely_response_rate]
