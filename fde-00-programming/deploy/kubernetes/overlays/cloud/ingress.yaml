# Uses the cluster's default IngressClass. Add TLS (cert-manager) before real traffic.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fde-00-programming
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fde-00-programming
                port: {name: http}
