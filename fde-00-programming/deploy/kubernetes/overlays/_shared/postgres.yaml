# In-cluster Postgres 16 for desktop clusters only (Docker Desktop, Rancher Desktop,
# kind). Managed clouds and OpenShift use a managed database instead (see terraform/).
# The password is a local lab value for an unexposed database; never reuse it.
apiVersion: v1
kind: Secret
metadata:
  name: fde-00-programming-db
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://complaints:complaints-local@fde-00-programming-postgres:5432/complaints
  POSTGRES_PASSWORD: complaints-local
---
apiVersion: v1
kind: Service
metadata:
  name: fde-00-programming-postgres
spec:
  selector:
    app: fde-00-programming-postgres
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fde-00-programming-postgres
spec:
  serviceName: fde-00-programming-postgres
  replicas: 1
  selector:
    matchLabels:
      app: fde-00-programming-postgres
  template:
    metadata:
      labels:
        app: fde-00-programming-postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70                 # the postgres user in postgres:16-alpine
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-alpine
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - {name: POSTGRES_DB, value: complaints}
            - {name: POSTGRES_USER, value: complaints}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: fde-00-programming-db, key: POSTGRES_PASSWORD}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "complaints", "-d", "complaints"]
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
# Only the API and the ingest job may reach Postgres.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fde-00-programming-postgres
spec:
  podSelector:
    matchLabels:
      app: fde-00-programming-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [fde-00-programming, fde-00-programming-ingest]
      ports:
        - {protocol: TCP, port: 5432}
