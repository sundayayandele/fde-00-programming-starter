# DATABASE_URL comes from the Secret fde-00-programming-db. Desktop overlays create it
# together with an in-cluster Postgres (overlays/_shared); on OpenShift and managed
# clouds create it out of band, pointing at the managed database:
#   kubectl -n fde create secret generic fde-00-programming-db \
#     --from-literal=DATABASE_URL='postgresql+psycopg://USER:PASSWORD@HOST:5432/complaints'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fde-00-programming
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: fde-00-programming
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels:
        app: fde-00-programming
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics/
    spec:
      serviceAccountName: fde-00-programming
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true          # no fixed runAsUser, so OpenShift can assign one
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: fde-00-programming:local
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: fde-00-programming-config}
            - secretRef: {name: fde-00-programming-db}
            - secretRef: {name: fde-00-programming-secrets, optional: true}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
