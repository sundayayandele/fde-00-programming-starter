# Podman Desktop: run with `podman kube play --replace deploy/podman/pod.yaml`
# after `podman build -t localhost/fde-00-programming:local .` (or `make up-podman`).
# Two containers share one pod network, so the API reaches Postgres on 127.0.0.1.
# Load data with `make ingest-podman ARGS="ingest-synthetic --count 5000"`, which runs
# the CLI inside the api container (`podman exec`).
#
# The Postgres password below is for a local, unexposed lab database only. To use a
# Podman secret instead:  podman secret create complaints-db-password - <<< "$POSTGRES_PASSWORD"
apiVersion: v1
kind: Pod
metadata:
  name: fde-00-programming
  labels:
    app.kubernetes.io/name: fde-00-programming
spec:
  restartPolicy: Always
  containers:
    - name: db
      image: docker.io/library/postgres:16-alpine
      env:
        - name: POSTGRES_DB
          value: complaints
        - name: POSTGRES_USER
          value: complaints
        - name: POSTGRES_PASSWORD
          value: complaints-local
      resources:
        limits:
          cpu: "1"
          memory: 512Mi
      securityContext:
        allowPrivilegeEscalation: false
      volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
      readinessProbe:
        exec:
          command: ["pg_isready", "-U", "complaints", "-d", "complaints"]
        initialDelaySeconds: 3
        periodSeconds: 5
    - name: api
      image: localhost/fde-00-programming:local
      ports:
        - containerPort: 8000
          hostPort: 8000
          hostIP: 127.0.0.1
      env:
        - name: ENVIRONMENT
          value: local
        - name: DATABASE_URL
          value: postgresql+psycopg://complaints:complaints-local@127.0.0.1:5432/complaints
      resources:
        limits:
          cpu: "1"
          memory: 512Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: tmp
          mountPath: /tmp
      livenessProbe:
        httpGet: {path: /health/live, port: 8000}
        initialDelaySeconds: 5
        periodSeconds: 10
      readinessProbe:
        httpGet: {path: /health/ready, port: 8000}
        initialDelaySeconds: 5
        periodSeconds: 5
  volumes:
    - name: tmp
      emptyDir: {}
    - name: pgdata
      persistentVolumeClaim:
        claimName: fde-00-programming-pgdata    # podman creates this named volume on first play
