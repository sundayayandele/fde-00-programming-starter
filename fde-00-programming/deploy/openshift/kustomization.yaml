# OpenShift / OKD: base manifests plus a Route. The base sets no fixed UID, so the
# restricted-v2 SCC can assign one; the image keeps group 0 permissions for that.
# Postgres: use a managed database or an operator-run one (e.g. Crunchy PGO), then
#   oc -n fde create secret generic fde-00-programming-db --from-literal=DATABASE_URL=...
#   oc new-project fde && oc apply -k deploy/openshift
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../kubernetes/base
  - route.yaml
images:
  - name: fde-00-programming
    newName: image-registry.openshift-image-registry.svc:5000/fde/fde-00-programming
    newTag: latest
patches:
  # OpenShift manages namespace security labels itself; drop the PSS labels from the base.
  - target: {kind: Namespace, name: fde}
    patch: |-
      - op: remove
        path: /metadata/labels
