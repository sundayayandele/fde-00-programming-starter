replicaCount: 2

image:
  repository: fde-00-programming
  tag: local
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8000

config:
  ENVIRONMENT: helm
  LOG_LEVEL: INFO

# Required: an existing Secret with a DATABASE_URL key pointing at Postgres, e.g.
#   kubectl create secret generic fde-00-programming-db \
#     --from-literal=DATABASE_URL='postgresql+psycopg://USER:PASSWORD@HOST:5432/complaints'
database:
  existingSecret: fde-00-programming-db

# Name of an existing Secret holding API keys (later phases). Optional.
existingSecret: fde-00-programming-secrets

# Scheduled CFPB pull (same image, CLI entry point).
ingest:
  enabled: true
  schedule: "15 6 * * *"
  timeZone: Etc/UTC
  suspend: false
  args: ["ingest-api", "--days", "2", "--limit", "5000"]
  activeDeadlineSeconds: 1800
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 500m, memory: 512Mi}

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

ingress:
  enabled: false
  className: ""
  host: ""

# OpenShift: set route.enabled=true and leave podSecurityContext without runAsUser.
route:
  enabled: false

podSecurityContext:
  runAsNonRoot: true
  seccompProfile: {type: RuntimeDefault}

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}
