apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fde-00-programming
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fde-00-programming
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
