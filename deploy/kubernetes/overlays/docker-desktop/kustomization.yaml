# Docker Desktop's built-in Kubernetes shares Docker's image store, so the image
# built with `docker build -t fde-00-programming:local .` is used directly.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fde
resources:
  - ../../base
images:
  - name: fde-00-programming
    newName: fde-00-programming
    newTag: local
components:
  - ../_shared
